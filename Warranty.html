<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crescent Builders – 50-Year Warranty</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>




<style>body{margin:0}.wa{transition:transform .2s,filter .2s}.wa:hover,.wa:focus-visible{transform:scale(1.07);filter:brightness(1.1)}
</style>
<style>body{margin:0}.soc{transition:transform .2s,filter .2s}.soc:hover,.soc:focus-visible{transform:translateY(-2px);filter:brightness(1.12)}</style>
<style>body{margin:0}.wa{transition:transform .2s,filter .2s}.wa:hover,.wa:focus-visible{transform:scale(1.07);filter:brightness(1.1)}
</style>
<style>body{margin:0}.wa{transition:transform .2s,filter .2s}.wa:hover,.wa:focus-visible{transform:scale(1.07);filter:brightness(1.1)}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./mobile.css">
<script src="https://elfsightcdn.com/platform.js" async></script>
<link rel="apple-touch-icon" href="./assets/favicon.png">
<link rel="icon" type="image/png" href="./assets/favicon.png?v=2">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.img-hero,.img-roof,.img-siding{background-color:#3d3d3d;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px)}
a{color:#b49609}a:hover{color:#8c7406}
.tex{background-color:#4f4502;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 56px)}
@media (max-width:860px){.h1{font-size:34px!important}.g2{grid-template-columns:minmax(0,1fr)!important}}
</style>
</helmet>
<div style="font-family: Montserrat, system-ui, sans-serif; color: #2b2b2b; background: #ffffff">
<dc-import name="Header" hint-size="100%,214px"></dc-import>


<section style="position: relative; color: #ffffff; background: #262626">
<div style="position: absolute; inset: 0; background: transparent"></div>
<div class="g2" style="position: relative; max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 14px">
<h1 class="h1" style="margin: 0; font-family: Montserrat, sans-serif; font-size: 44px; font-weight: 800; line-height: 1.15">The Crescent Builders 50-Year Warranty</h1>
<span style="font-size: 24px; font-weight: 800; color: #e3d26a">Peace Of Mind For Every Project</span>
<p style="margin: 0 0 14px; font-size: 16px; line-height: 1.6; color: #efefef">Our comprehensive warranty coverage lets you upgrade your home with confidence.</p>
<sc-for list="{{items}}" as="i" hint-placeholder-count="4">
<div style="display: flex; gap: 20px; align-items: center">
<span aria-hidden="true" style="flex: 0 0 52px; height: 52px; background: url(./assets/7d41127045ab63bf0f6b16827f7d6472.png) no-repeat; background-size: 208px 52px; background-position: {{i.pos}}"></span>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #f2f2f2"><b style="color: #ffffff">{{i.t}}:</b> {{i.d}}</p>
</div>
</sc-for>
</div>
<div style="display: flex; justify-content: center"><img src="./assets/1164ee7b629aa338110e9392173371e9.png" alt="The Crescent Builders 50-Year Workmanship Warranty badge" style="width: 100%; max-width: 440px; height: auto; display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45))"></div>
</div>
</section>


</div>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (n) => (-n * 52) + 'px 0';
    return { items: [
      { t: '50-Year Workmanship Warranty', pos: p(0), d: 'Every project is backed by our 50-year workmanship warranty, so you’re protected long after the job is done.' },
      { t: 'Local Expertise', pos: p(1), d: 'Our Houston team builds every project to handle Gulf Coast heat, humidity, hail and hurricane-season storms.' },
      { t: '40-Point Post-Installation Inspection', pos: p(2), d: 'After every installation, we complete a detailed 40-point inspection to make sure every detail meets our standards.' },
      { t: 'Customer Satisfaction Guarantee', pos: p(3), d: 'If you’re not completely happy with our work, we’ll make it right, from first estimate to final cleanup.' }
    ] };
  }
}
</script>
<script src="./mobile.js"></script>
<script src="./reviews-widget.js"></script>
</body>
</html>
